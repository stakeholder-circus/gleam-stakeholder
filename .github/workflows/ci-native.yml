name: ci-native

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: '27'
          gleam-version: '1.14.0'
          rebar3-version: '3'
      - run: python3 scripts/validate_scaffold.py
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test
      - run: gleam run -- --list-values
