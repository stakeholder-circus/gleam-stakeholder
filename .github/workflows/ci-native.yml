name: ci-native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validate_scaffold.py
      - run: gleam deps download
      - run: gleam format --check src test
      - run: gleam test
      - run: gleam run -- --list-values
