name: docker-smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t gleam-stakeholder .
      - run: docker run --rm gleam-stakeholder --list-values
      - run: docker run --rm gleam-stakeholder --focus-family code_analyzer --output-format json --seed docker-code
      - run: docker run --rm gleam-stakeholder --focus-family data_processing --output-format json --seed docker-data
      - run: docker run --rm gleam-stakeholder --focus-family agent_workflows --output-format json --seed docker-agent
      - run: docker run --rm gleam-stakeholder --focus-family delivery_preview_ops --output-format json --seed docker-delivery
      - shell: bash
        run: |
          first=$(docker run --rm gleam-stakeholder --focus-family platform_engineering --output-format json --seed same-seed)
          second=$(docker run --rm gleam-stakeholder --focus-family platform_engineering --output-format json --seed same-seed)
          test "$first" = "$second"
      - shell: bash
        run: |
          set +e
          docker run --rm gleam-stakeholder --experimental-provider openai-compatible >/tmp/gleam-provider.out 2>/tmp/gleam-provider.err
          code=$?
          set -e
          test "$code" -eq 1
          grep -q 'experimental-provider is not implemented yet in gleam-stakeholder' /tmp/gleam-provider.err
